# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "f59dcb317c21249eb8f5c801fb6fa5ce"
application_url = "https://tryoracore-production.up.railway.app"
embedded = true
name = "Visually"

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "read_orders,write_customers,write_products,write_metaobjects,write_metaobject_definitions,write_files"

[webhooks]
api_version = "2026-10"

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = [ "app/uninstalled" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/scopes_update"
  topics = [ "app/scopes_update" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/compliance"
  compliance_topics = [ "customers/data_request", "customers/redact", "shop/redact" ]

[auth]
redirect_urls = [ "https://tryoracore-production.up.railway.app/auth/callback" ]

[build]
automatically_update_urls_on_dev = false

[app_proxy]
url = "https://tryoracore-production.up.railway.app/proxy"
subpath = "visully"
prefix = "apps"
