# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "075fb0adbeac912feb01d3be0fdd51aa"
application_url = "https://tryoracore-production.up.railway.app"
embedded = true
name = "Tryora"

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "write_customers,write_products,write_metaobjects,write_metaobject_definitions"

[webhooks]
api_version = "2027-01"

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = [ "app/uninstalled" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/scopes_update"
  topics = [ "app/scopes_update" ]

[auth]
redirect_urls = [ "https://tryoracore-production.up.railway.app/auth/callback" ]

[build]
automatically_update_urls_on_dev = true

[app_proxy]
url = "https://tryoracore-production.up.railway.app/proxy"
subpath = "tryora"
prefix = "apps"
